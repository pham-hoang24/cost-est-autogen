<!DOCTYPE html>
<html>
<head>
    <title>Test Upload</title>
</head>
<body>
    <h1>Test Data Anonymization Upload</h1>
    <input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.json,.txt,.pdf,.doc,.docx">
    <button onclick="testUpload()">Test Upload</button>
    <div id="result"></div>

    <script>
        async function testUpload() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                console.log('Uploading file:', file.name);
                
                const response = await fetch('http://localhost:8082/api/upload', {
                    method: 'POST',
                    body: formData,
                });

                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Upload failed: ${errorText}`);
                }

                const result = await response.json();
                console.log('Upload result:', result);
                
                document.getElementById('result').innerHTML = `
                    <h3>Upload Successful!</h3>
                    <p><strong>Job ID:</strong> ${result.job_id}</p>
                    <p><strong>Filename:</strong> ${result.filename}</p>
                    <p><strong>Status:</strong> ${result.status}</p>
                    <p><strong>Record Count:</strong> ${result.record_count}</p>
                    <p><strong>PII Detections:</strong></p>
                    <ul>
                        ${result.pii_detections.map(pii => `<li>${pii.type}: ${pii.count} (sample: ${pii.sample})</li>`).join('')}
                    </ul>
                    <button onclick="testAnonymize('${result.job_id}')">Test Anonymize</button>
                `;
                
            } catch (error) {
                console.error('Upload error:', error);
                document.getElementById('result').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }

        async function testAnonymize(jobId) {
            try {
                console.log('Anonymizing job:', jobId);
                
                const response = await fetch(`http://localhost:8082/api/anonymize/${jobId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        algorithm: 'k-anonymity',
                        parameters: { k: 3 }
                    }),
                });

                console.log('Anonymize response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Anonymization failed: ${errorText}`);
                }

                const result = await response.json();
                console.log('Anonymize result:', result);
                
                document.getElementById('result').innerHTML += `
                    <h3>Anonymization Successful!</h3>
                    <p><strong>Status:</strong> ${result.status}</p>
                    <p><strong>Algorithm:</strong> ${result.result.algorithm}</p>
                    <p><strong>Original Records:</strong> ${result.result.original_records}</p>
                    <p><strong>Anonymized Records:</strong> ${result.result.anonymized_records}</p>
                    <p><strong>Output File:</strong> ${result.result.output_file}</p>
                    <button onclick="testDownload('${jobId}')">Test Download</button>
                `;
                
            } catch (error) {
                console.error('Anonymization error:', error);
                document.getElementById('result').innerHTML += `<p style="color: red;">Anonymization Error: ${error.message}</p>`;
            }
        }

        async function testDownload(jobId) {
            try {
                console.log('Downloading job:', jobId);
                
                const response = await fetch(`http://localhost:8082/api/download/${jobId}`);
                console.log('Download response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Download failed: ${errorText}`);
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `anonymized_${jobId}.csv`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                document.getElementById('result').innerHTML += `<p style="color: green;">Download successful!</p>`;
                
            } catch (error) {
                console.error('Download error:', error);
                document.getElementById('result').innerHTML += `<p style="color: red;">Download Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
