version: '3.8'

services:
  # Frontend - Next.js React App
  frontend:
    build:
      context: ./sandbox/ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - sw4e-network

  # Backend - Simple Express Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    networks:
      - sw4e-network

networks:
  sw4e-network:
    driver: bridge