name: Build, Scan, SBOM, Sign Template Images

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/templates/**'
      - '.github/workflows/build_demo_image.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        template:
          - llm-rag-starter
          - mlops-lab
          - se-productivity-bench
          - healthcare-safe
          - iot-timeseries
          - teaching-101
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      IMAGE: ${{ github.repository_owner }}/ai-sandbox-${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: vars
        run: |
          SHA=${GITHUB_SHA::12}
          echo "sha_short=$SHA" >> $GITHUB_OUTPUT
          echo "version=0.1.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: apps/templates/${{ matrix.template }}
          file: apps/templates/${{ matrix.template }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.vars.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ steps.vars.outputs.sha_short }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=ai-sandbox-${{ matrix.template }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ steps.vars.outputs.sha_short }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate SBOM (Syft)
        uses: anchore/syft-action@v0.20.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ steps.vars.outputs.sha_short }}
          output: 'sbom.spdx.json'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.template }}-sha-${{ steps.vars.outputs.sha_short }}.spdx.json
          path: sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ steps.vars.outputs.sha_short }}
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.vars.outputs.version }}



