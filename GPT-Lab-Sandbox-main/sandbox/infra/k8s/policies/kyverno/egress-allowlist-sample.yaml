apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-allowlist
  namespace: teaching
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
      # Example allowed endpoints (documented, enforce via egress gateway or FQDN policies in prod):
      # - pypi.org
      # - files.pythonhosted.org
      # - conda.anaconda.org
      # - huggingface.co
      # - ghcr.io


