repositories:
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: jetstack
    url: https://charts.jetstack.io
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: kyverno
    url: https://kyverno.github.io/kyverno/
  - name: hashicorp
    url: https://helm.releases.hashicorp.com
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: codecentric
    url: https://codecentric.github.io/helm-charts
  - name: nvidia
    url: https://nvidia.github.io/gpu-operator

releases:
  - name: ingress-nginx
    namespace: ingress-nginx
    chart: ingress-nginx/ingress-nginx
    version: 4.10.0
    values:
      - values/ingress-nginx.yaml

  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: v1.15.1
    values:
      - values/cert-manager.yaml

  - name: kube-prometheus-stack
    namespace: monitoring
    chart: prometheus-community/kube-prometheus-stack
    version: 62.1.0
    values:
      - values/kube-prometheus-stack.yaml

  - name: loki
    namespace: monitoring
    chart: grafana/loki
    version: 6.6.3
    values:
      - values/loki.yaml

  - name: kyverno
    namespace: kyverno
    chart: kyverno/kyverno
    version: 3.1.4
    values:
      - values/kyverno.yaml

  - name: kyverno-policies
    namespace: kyverno
    chart: kyverno/kyverno-policies
    version: 3.1.4

  - name: vault
    namespace: vault
    chart: hashicorp/vault
    version: 0.27.0
    values:
      - values/vault.yaml

  - name: keycloak
    namespace: keycloak
    chart: codecentric/keycloakx
    version: 2.5.0
    values:
      - values/keycloak.yaml

  - name: minio
    namespace: minio
    chart: bitnami/minio
    version: 14.7.16
    values:
      - values/minio.yaml

  - name: mlflow
    namespace: mlflow
    chart: bitnami/mlflow
    version: 1.9.6
    values:
      - values/mlflow.yaml

  # Optional external-dns
  - name: external-dns
    namespace: networking
    chart: bitnami/external-dns
    version: 6.33.6
    installed: false
    values:
      - values/external-dns.yaml

  # Optional NVIDIA GPU Operator (Autopilot compatibility varies)
  - name: gpu-operator
    namespace: gpu-operator
    chart: nvidia/gpu-operator
    version: 24.6.0
    installed: false


