apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: control-plane
  labels:
    app: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: control-plane
      containers:
        - name: api
          image: ghcr.io/example/ai-sandbox-control-plane:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: control-plane
spec:
  selector:
    app: control-plane
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  namespace: control-plane
  annotations:
    iam.gke.io/gcp-service-account: control-plane@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: control-plane
rules:
  - apiGroups: ["", "apps", "batch", "extensions", "rbac.authorization.k8s.io"]
    resources: ["namespaces", "pods", "deployments", "services", "configmaps", "secrets", "ingresses", "rolebindings", "roles"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: control-plane
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: control-plane



